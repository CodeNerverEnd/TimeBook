<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>TimeBook · 桌面版原型</title>
<style>
  :root{
    --primary:#2F6B4F; --primary-dark:#245840; --primary-container:#DCEBE1; --on-primary-container:#0E2C1C;
    --secondary:#B4803A; --bg:#FAF8F3; --surface:#FFFFFF; --surface-variant:#EFEBE2;
    --on-surface:#1C1B18; --on-surface-variant:#6B655B; --outline:#D9D3C7; --line:#E9E4D9;
    --error:#B3261E; --side:#F7F4EC; --window:#E9E4D9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--window);
    font-family:"Microsoft YaHei UI","Microsoft YaHei",-apple-system,"Segoe UI",system-ui,sans-serif;
    color:var(--on-surface); font-size:13px; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:22px;
  }
  .win{
    width:min(1280px,100%); height:min(812px,calc(100vh - 44px));
    background:var(--bg); border-radius:12px; overflow:hidden;
    box-shadow:0 30px 70px rgba(28,27,24,.26), 0 0 0 1px rgba(28,27,24,.10);
    display:flex; flex-direction:column;
  }
  /* ---------------- 标题栏 ---------------- */
  .titlebar{
    flex:0 0 38px; background:var(--side); border-bottom:1px solid var(--line);
    display:flex; align-items:center; padding:0 0 0 16px; user-select:none;
  }
  .tb-title{font-size:12px;color:#6B655B;display:flex;align-items:center;gap:8px;}
  .tb-mark{width:16px;height:16px;border-radius:4px;background:var(--primary);color:#fff;
    font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;}
  .winbtns{margin-left:auto;display:flex;height:100%;}
  .winbtn{width:46px;height:100%;display:flex;align-items:center;justify-content:center;color:#6B655B;cursor:default;}
  .winbtn:hover{background:#E9E4D9;}
  .winbtn.close:hover{background:#C42B1C;color:#fff;}
  .winbtn svg{width:10px;height:10px;stroke:currentColor;stroke-width:1.4;fill:none;}

  .winbody{flex:1;display:flex;min-height:0;}

  /* ---------------- 侧边栏 ---------------- */
  .side{
    width:212px;flex:0 0 212px;background:var(--side);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:18px 12px 12px;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px;}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;letter-spacing:1px;}
  .brand-name{font-size:15px;font-weight:600;letter-spacing:.4px;}
  .brand-sub{font-size:10.5px;color:var(--on-surface-variant);margin-top:2px;}
  .nav{display:flex;flex-direction:column;gap:2px;}
  .navitem{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;
    color:#57524A;cursor:pointer;font-size:13.5px;transition:background .12s ease;
  }
  .navitem svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;}
  .navitem:hover{background:#EFEBE2;}
  .navitem.active{background:var(--primary-container);color:var(--primary-dark);font-weight:600;}
  .nav-sep{height:1px;background:var(--line);margin:12px 8px;}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;}
  .side-ver{font-size:10.5px;color:#9A948A;padding:10px 10px 2px;}

  /* ---------------- 主区 ---------------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);}
  .topbar{
    flex:0 0 62px;display:flex;align-items:center;gap:16px;padding:0 26px;
    border-bottom:1px solid var(--line);background:rgba(250,248,243,.92);
  }
  .tb-left{min-width:0;}
  .tb-date{font-size:14px;font-weight:600;}
  .tb-sub{font-size:11.5px;color:var(--on-surface-variant);margin-top:3px;}
  .tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;}

  .runpill{
    display:flex;align-items:center;gap:10px;height:36px;padding:0 6px 0 12px;border-radius:10px;
    background:var(--primary-container);color:var(--on-primary-container);
  }
  .runpill .dot{width:7px;height:7px;border-radius:50%;background:var(--primary);animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .runpill .nm{font-size:12.5px;font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .runpill .ck{font-size:12.5px;font-variant-numeric:tabular-nums;letter-spacing:.4px;}
  .runpill .mini-btn{height:26px;padding:0 10px;border-radius:7px;background:var(--primary);color:#fff;border:none;font-size:11.5px;cursor:pointer;font-family:inherit;}

  .scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 26px 30px;}
  .scroll::-webkit-scrollbar{width:10px;}
  .scroll::-webkit-scrollbar-thumb{background:#DAD4C7;border-radius:5px;border:3px solid var(--bg);}
  .scroll::-webkit-scrollbar-track{background:transparent;}

  /* ---------------- 通用 ---------------- */
  .row{display:flex;align-items:center;}
  .grow{flex:1;min-width:0;}
  .muted{color:var(--on-surface-variant);}
  .small{font-size:11.5px;color:var(--on-surface-variant);}
  .mono{font-variant-numeric:tabular-nums;}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .sec-title{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-size:12.5px;font-weight:600;color:#4A453C;}
  .sec-title .grow{flex:1;}
  .link{font-size:11.5px;color:var(--primary);cursor:pointer;font-weight:500;}
  .link:hover{text-decoration:underline;}
  .card{background:var(--surface);border-radius:12px;padding:14px 16px;box-shadow:0 1px 2px rgba(28,27,24,.045);border:1px solid rgba(28,27,24,.04);}
  .chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:6px;
    background:var(--surface-variant);font-size:10.5px;color:#5C574D;white-space:nowrap;}
  .btn{
    height:34px;padding:0 14px;border-radius:9px;border:none;background:var(--primary);color:#fff;
    font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{background:var(--primary-dark);}
  .btn.ghost{background:transparent;color:var(--primary);border:1.2px solid #B9D2C3;}
  .btn.ghost:hover{background:#EFF6F1;}
  .btn.sub{background:var(--surface-variant);color:#4A453C;}
  .btn.sub:hover{background:#E4DFD2;}
  .btn.sm{height:28px;padding:0 10px;font-size:11.5px;border-radius:7px;}
  .btn.danger{background:transparent;color:var(--error);border:1px solid #E7C9C6;}
  .icon-btn{width:28px;height:28px;border-radius:7px;border:none;background:transparent;color:#8A8478;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
  .icon-btn:hover{background:var(--surface-variant);color:#4A453C;}
  .icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}

  .grid-main{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:18px;align-items:start;}
  @media (max-width:1080px){ .grid-main{grid-template-columns:minmax(0,1fr);} }

  /* ---------------- 计时页 ---------------- */
  .run-card{
    border-radius:16px;padding:22px 24px;background:linear-gradient(155deg,#DCEBE1 0%,#CBE1D3 100%);
    position:relative;overflow:hidden;
  }
  .run-card.idle{background:linear-gradient(155deg,#F2EEE5 0%,#E8E2D4 100%);}
  .run-card .rc-top{display:flex;align-items:flex-start;gap:10px;}
  .rc-item{font-size:15px;font-weight:600;color:var(--on-primary-container);display:flex;align-items:center;gap:8px;}
  .rc-tags{display:flex;gap:5px;margin-top:6px;}
  .rc-tags .chip{background:rgba(255,255,255,.66);}
  .rc-clock{font-size:52px;font-weight:200;letter-spacing:1.5px;font-variant-numeric:tabular-nums;
    color:var(--on-primary-container);line-height:1.1;margin:14px 0 4px;}
  .run-card.idle .rc-clock{color:#8A8478;}
  .rc-hint{font-size:11.5px;color:#5C6F63;}
  .run-card.idle .rc-hint{color:#8A8478;}
  .rc-actions{display:flex;gap:8px;margin-top:16px;}
  .rc-actions .btn{height:36px;}
  .rc-actions .btn.wide{min-width:118px;justify-content:center;}
  .btn.stop{background:#8C3A33;}
  .btn.stop:hover{background:#7A302A;}
  .rc-note{
    margin-top:14px;padding-top:12px;border-top:1px solid rgba(14,44,28,.12);
    font-size:12px;color:#3D5548;display:flex;align-items:flex-start;gap:6px;cursor:pointer;
  }
  .rc-note .ph{color:#7C8D82;}
  .rc-note:hover .ph{color:var(--primary);text-decoration:underline;}

  .quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:10px;}
  .qcard{
    background:var(--surface);border-radius:11px;padding:12px 13px;border:1px solid rgba(28,27,24,.05);
    display:flex;align-items:center;gap:10px;cursor:pointer;transition:box-shadow .14s ease,transform .14s ease;
  }
  .qcard:hover{box-shadow:0 4px 14px rgba(28,27,24,.09);transform:translateY(-1px);}
  .qcard.playing{background:var(--primary-container);border-color:#BCD5C5;}
  .qcard .nm{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .qcard .meta{font-size:10.5px;color:var(--on-surface-variant);margin-top:3px;}
  .playbtn{width:28px;height:28px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .playbtn svg{width:11px;height:11px;fill:#fff;stroke:none;margin-left:1px;}

  .tl{position:relative;padding-left:0;}
  .tlrow{display:flex;gap:12px;padding:7px 0;}
  .tl-time{width:44px;flex:0 0 44px;font-size:11px;color:var(--on-surface-variant);text-align:right;padding-top:9px;font-variant-numeric:tabular-nums;}
  .tl-body{flex:1;min-width:0;background:var(--surface);border-radius:10px;padding:9px 12px;
    border:1px solid rgba(28,27,24,.045);display:flex;align-items:center;gap:9px;cursor:pointer;}
  .tl-body:hover{background:#FCFAF6;}
  .tl-nm{font-size:12.5px;font-weight:600;}
  .tl-note{font-size:11px;color:var(--on-surface-variant);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tl-dur{font-size:12px;font-variant-numeric:tabular-nums;color:#4A453C;margin-left:auto;flex:0 0 auto;}

  .side-card{background:var(--surface);border-radius:12px;padding:14px 16px;border:1px solid rgba(28,27,24,.045);margin-bottom:12px;}
  .sc-title{font-size:11.5px;color:var(--on-surface-variant);display:flex;align-items:center;gap:6px;}
  .sc-big{font-size:26px;font-weight:600;letter-spacing:.4px;margin-top:6px;}
  .kpis{display:flex;gap:0;margin-top:12px;}
  .kpi{flex:1;border-right:1px solid var(--line);}
  .kpi:last-child{border-right:none;}
  .kpi .v{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
  .kpi .k{font-size:10.5px;color:var(--on-surface-variant);margin-top:2px;}

  .bar7{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:12px;}
  .bar7 .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center;gap:4px;}
  .bar7 .b{width:100%;background:#D8E6DC;border-radius:3px;}
  .bar7 .c.today .b{background:var(--primary);}
  .bar7 .l{font-size:9.5px;color:#9A948A;}
  .bar7 .c.today .l{color:var(--primary);font-weight:600;}

  .prog{height:6px;border-radius:3px;background:var(--surface-variant);overflow:hidden;}
  .prog > i{display:block;height:100%;border-radius:3px;background:var(--primary);}
  .prog > i.over{background:var(--secondary);}

  /* ---------------- 记录页 ---------------- */
  .pagehead{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .pagehead .h{font-size:19px;font-weight:600;letter-spacing:.3px;}
  .seg{display:flex;background:var(--surface-variant);border-radius:9px;padding:3px;}
  .seg > div{padding:5px 12px;border-radius:7px;font-size:12px;color:#5C574D;cursor:pointer;}
  .seg > div.on{background:var(--surface);color:var(--primary);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .navbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--outline);background:var(--surface);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:#5C574D;}
  .navbtn:hover{background:#F6F2E9;}
  .navbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}

  table.rec{width:100%;border-collapse:separate;border-spacing:0;}
  table.rec th{
    text-align:left;font-size:10.5px;font-weight:600;color:#8A8478;letter-spacing:.4px;
    padding:0 10px 8px;border-bottom:1px solid var(--line);
  }
  table.rec td{padding:10px;border-bottom:1px solid #F1EDE4;font-size:12.5px;vertical-align:middle;}
  table.rec tr:last-child td{border-bottom:none;}
  table.rec tbody tr:hover{background:#FCFAF5;}
  .tagline{display:flex;gap:4px;flex-wrap:wrap;}
  .notecell{max-width:280px;color:var(--on-surface-variant);font-size:11.5px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%;}
  .notecell.empty{color:#B3ADA2;cursor:pointer;}
  .notecell.empty:hover{color:var(--primary);}

  /* ---------------- 统计页 ---------------- */
  .stat-total{display:flex;align-items:flex-end;gap:22px;padding:18px 20px;border-radius:14px;
    background:linear-gradient(150deg,#DCEBE1,#CFE3D6);}
  .stat-total .big{font-size:38px;font-weight:300;letter-spacing:1px;font-variant-numeric:tabular-nums;color:var(--on-primary-container);}
  .stat-total .lab{font-size:11.5px;color:#4E6657;margin-bottom:6px;}
  .stat-total .mini{display:flex;gap:26px;margin-left:auto;padding-bottom:5px;}
  .stat-total .mini div{text-align:right;}
  .stat-total .mini .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--on-primary-container);}
  .stat-total .mini .k{font-size:10.5px;color:#5C6F63;margin-top:2px;}

  .chart{display:flex;align-items:flex-end;gap:3px;height:132px;margin-top:18px;}
  .chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;}
  .chart .b{width:100%;background:#3E7A5C;border-radius:2px;min-height:2px;opacity:.88;}
  .chart .b.dim{background:#C9DCCF;}
  .chart .col:hover .b{opacity:1;}
  .chart-x{display:flex;margin-top:5px;gap:3px;}
  .chart-x div{flex:1;text-align:center;font-size:9px;color:#A39C90;}

  .tagtree .trow{display:flex;align-items:center;gap:9px;padding:10px 4px;border-bottom:1px solid #F2EEE5;cursor:pointer;}
  .tagtree .trow:hover{background:#FCFAF5;}
  .tagtree .caret{width:14px;height:14px;color:#9A948A;transition:transform .15s ease;}
  .tagtree .caret.open{transform:rotate(90deg);}
  .tagtree .caret svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;}
  .tagtree .tnm{font-size:12.5px;font-weight:600;}
  .tagtree .tmeta{font-size:10.5px;color:var(--on-surface-variant);}
  .tagtree .tv{font-size:12.5px;font-variant-numeric:tabular-nums;margin-left:auto;font-weight:600;}
  .tagtree .child{display:flex;align-items:center;gap:8px;padding:7px 4px 7px 34px;border-bottom:1px solid #F5F1E9;background:#FCFAF5;}
  .tagtree .child .nm{font-size:12px;}
  .tagtree .child .v{font-size:11.5px;font-variant-numeric:tabular-nums;color:#4A453C;margin-left:auto;}

  /* ---------------- 计划页 ---------------- */
  .plan-total{padding:18px 20px;border-radius:14px;background:var(--surface);border:1px solid rgba(28,27,24,.05);}
  .plan-total .pt-top{display:flex;align-items:flex-end;gap:8px;}
  .plan-total .pct{font-size:32px;font-weight:400;letter-spacing:.5px;font-variant-numeric:tabular-nums;color:var(--primary);}
  .plan-total .frac{font-size:12.5px;color:var(--on-surface-variant);padding-bottom:6px;}
  .plan-total .prog{height:9px;margin-top:12px;}
  .plan-total .pt-foot{display:flex;gap:24px;margin-top:12px;}
  .plan-total .pt-foot div{font-size:11.5px;color:var(--on-surface-variant);}
  .plan-total .pt-foot b{color:#3F3B34;font-weight:600;font-variant-numeric:tabular-nums;}

  .prow{background:var(--surface);border-radius:11px;border:1px solid rgba(28,27,24,.05);margin-bottom:8px;overflow:hidden;}
  .prow .ph{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;}
  .prow .ph:hover{background:#FCFAF5;}
  .prow .pnm{font-size:12.5px;font-weight:600;}
  .prow .psub{font-size:10.5px;color:var(--on-surface-variant);margin-top:2px;}
  .prow .pbar{width:180px;flex:0 0 180px;}
  .prow .pval{width:112px;flex:0 0 112px;text-align:right;font-size:11.5px;font-variant-numeric:tabular-nums;color:#4A453C;}
  .prow .pval b{font-weight:600;}
  .prow .pct{width:42px;flex:0 0 42px;text-align:right;font-size:11.5px;font-weight:600;color:var(--primary);font-variant-numeric:tabular-nums;}
  .pchild{background:#FCFAF5;border-top:1px solid #F2EEE5;padding:8px 14px 10px 34px;}
  .pchild .cr{display:flex;align-items:center;gap:10px;padding:6px 0;}
  .pchild .cnm{font-size:12px;}
  .pchild .cbar{width:150px;flex:0 0 150px;}
  .pchild .cval{width:120px;flex:0 0 120px;text-align:right;font-size:11px;color:#6B655B;font-variant-numeric:tabular-nums;}
  .pchild .cset{font-size:11px;color:var(--primary);cursor:pointer;padding:2px 8px;border-radius:5px;}
  .pchild .cset:hover{background:#EAF2ED;}

  .hist{background:var(--surface);border-radius:11px;border:1px solid rgba(28,27,24,.05);padding:14px 16px;margin-bottom:10px;}
  .hist .hh{display:flex;align-items:center;gap:9px;}
  .hist .hname{font-size:13px;font-weight:600;}
  .badge{font-size:10px;padding:2px 7px;border-radius:5px;background:#EDE7DA;color:#7A7264;}
  .badge.closed{background:#E5DFD0;color:#6B6355;}
  .hist .hsum{font-size:12px;color:#57524A;line-height:1.65;margin-top:9px;white-space:pre-wrap;}
  .hist .hkm{display:flex;gap:18px;margin-top:10px;font-size:11px;color:var(--on-surface-variant);}
  .hist .hkm b{color:#3F3B34;font-variant-numeric:tabular-nums;}

  /* ---------------- 事项页 ---------------- */
  .itemgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:10px;}
  .icard{background:var(--surface);border-radius:11px;border:1px solid rgba(28,27,24,.05);padding:13px 14px;cursor:pointer;}
  .icard:hover{box-shadow:0 4px 14px rgba(28,27,24,.08);}
  .icard .inm{font-size:12.5px;font-weight:600;}
  .icard .imeta{font-size:10.5px;color:var(--on-surface-variant);margin-top:6px;display:flex;gap:10px;}
  .icard .itags{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;}

  /* ---------------- 弹窗 ---------------- */
  .overlay{position:fixed;inset:0;background:rgba(28,27,24,.42);display:flex;align-items:center;justify-content:center;z-index:200;padding:24px;}
  .overlay[hidden]{display:none;}
  .dialog{background:var(--surface);border-radius:16px;padding:22px 24px;width:100%;max-width:430px;
    max-height:88vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.28);}
  .dialog.wide{max-width:520px;}
  .dlg-h{display:flex;align-items:center;margin-bottom:4px;}
  .dlg-h .t{font-size:15px;font-weight:600;}
  .dlg-h .x{margin-left:auto;}
  .dlg-sub{font-size:11.5px;color:var(--on-surface-variant);margin-bottom:16px;line-height:1.6;}
  .field{margin-bottom:13px;}
  .field > label{display:block;font-size:11.5px;color:#57524A;margin-bottom:6px;font-weight:600;}
  .input, .textarea, select.input{
    width:100%;border:1px solid var(--outline);border-radius:8px;padding:8px 10px;
    font-size:12.5px;font-family:inherit;color:var(--on-surface);background:#FDFCF9;outline:none;
  }
  .input:focus, .textarea:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(47,107,79,.09);}
  .textarea{resize:vertical;min-height:76px;line-height:1.6;}
  .swatches{display:flex;gap:7px;flex-wrap:wrap;}
  .sw{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .sw.sel{border-color:#fff;box-shadow:0 0 0 2px var(--primary);}
  .tagpick{display:flex;gap:6px;flex-wrap:wrap;}
  .tagpick .pk{display:inline-flex;align-items:center;gap:5px;height:27px;padding:0 10px;border-radius:7px;

/* ---------------- 工具 ---------------- */
const pad = n => String(n).padStart(2,'0');
const clock = ms => {
  const t = Math.max(0, Math.floor(ms/1000));
  return pad(Math.floor(t/3600)) + ':' + pad(Math.floor(t%3600/60)) + ':' + pad(t%60);
};
const human = ms => {
  const t = Math.max(0, ms);
  if (t < 1000) return '0分';
  const m = Math.floor(t/60000);
  if (m < 1) return Math.floor(t/1000) + '秒';
  const h = Math.floor(m/60), mm = m%60;
  if (h && mm) return h + '小时' + mm + '分';
  if (h) return h + '小时';
  return mm + '分';
};
const hm = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dstr = d => (d.getMonth()+1) + '月' + d.getDate() + '日';
const dow = d => ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
const startOfDay = d => { const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const MONTH_KEY = (() => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1); })();

state.planTargets = [

    snapshot:{totalTargetMinutes:5700, totalUsedMillis:0, rows:[

    snapshot:{totalTargetMinutes:66000, totalUsedMillis:0, rows:[

/* ---------------- 计算 ---------------- */
const itemById = id => state.items.find(i => i.id === id);
const tagById = id => state.tags.find(t => t.id === id);
const nowTs = () => Date.now();
const endOf = r => r.endAt == null ? nowTs() : r.endAt;

function overlap(r, s, e){
  return Math.max(0, Math.min(endOf(r), e) - Math.max(r.startAt, s));
}

function rangeOf(mode, anchor){
  const d = new Date(anchor);
  if (mode === 'day'){
    const s = startOfDay(d); return {s, e:s+DAY};
  }
  if (mode === 'month'){
    const s = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
    const e = new Date(d.getFullYear(), d.getMonth()+1, 1).getTime();
    return {s, e};
  }
  const s = new Date(d.getFullYear(), 0, 1).getTime();
  const e = new Date(d.getFullYear()+1, 0, 1).getTime();
  return {s, e};
}

function totalsIn(s, e){
  let sum = 0, count = 0;
  const perItem = new Map();
  state.records.forEach(r => {
    const d = overlap(r, s, e);
    if (d <= 0) return;
    sum += d; count++;
    perItem.set(r.itemId, (perItem.get(r.itemId)||0) + d);
  });
  return {sum, count, perItem};
}

/* 计划 */
function fiveStart(y){
  const diff = y - 2021;
  const off = diff >= 0 ? Math.floor(diff/5)*5 : -Math.ceil(-diff/5)*5;
  return 2021 + off;
}
function planKey(period, date){
  const y = date.getFullYear(), m = date.getMonth()+1;
  if (period === 'MONTH') return y + '-' + pad(m);
  if (period === 'YEAR') return String(y);
  const s = fiveStart(y);
  return s + '-' + (s+4);
}
function planRange(period, date){
  const y = date.getFullYear(), m = date.getMonth();
  if (period === 'MONTH') return {s:new Date(y,m,1).getTime(), e:new Date(y,m+1,1).getTime()};
  if (period === 'YEAR') return {s:new Date(y,0,1).getTime(), e:new Date(y+1,0,1).getTime()};
  const s = fiveStart(y);
  return {s:new Date(s,0,1).getTime(), e:new Date(s+5,0,1).getTime()};
}
function planLabel(period, date){
  const y = date.getFullYear(), m = date.getMonth()+1;
  if (period === 'MONTH') return y + '年' + m + '月';
  if (period === 'YEAR') return y + '年';
  const s = fiveStart(y);
  return s + '–' + (s+4) + '年';
}
function shiftPlan(period, date, delta){
  const d = new Date(date);
  if (period === 'MONTH') return new Date(d.getFullYear(), d.getMonth()+delta, 1);
  if (period === 'YEAR') return new Date(d.getFullYear()+delta, 0, 1);
  return new Date(d.getFullYear()+delta*5, 0, 1);
}

function computePlan(period, date){
  const key = planKey(period, date);
  const {s, e} = planRange(period, date);
  const totals = totalsIn(s, e);

  const targets = state.planTargets.filter(p => p.periodType === period && p.periodKey === key);
  const tagT = {}, itemT = {};
  targets.forEach(p => { (p.targetType === 'ITEM' ? itemT : tagT)[p.refId] = p.targetMinutes; });

  const rows = state.tags.map(tag => {
    const items = state.items.filter(i => i.tagIds.includes(tag.id));
    const itemRows = items.map(it => ({
      item:it,
      used:totals.perItem.get(it.id) || 0,
      target:itemT[it.id] || 0
    })).filter(x => !(x.item.archived && x.used <= 0))
      .sort((a,b) => b.used - a.used || b.target - a.target);
    const used = items.reduce((acc,i) => acc + (totals.perItem.get(i.id)||0), 0);
    return {
      tag, target:tagT[tag.id]||0, used, items:itemRows,
      itemTarget:itemRows.reduce((a,b) => a + b.target, 0)
    };
  }).filter(r => r.target > 0 || r.used > 0 || r.itemTarget > 0)
    .sort((a,b) => b.target - a.target || b.used - a.used);

  let orphan = 0;
  Object.keys(itemT).forEach(id => {
    const it = itemById(id);
    if (!it) return;
    const covered = it.tagIds.some(tid => (tagT[tid]||0) > 0);
    if (!covered) orphan += itemT[id];
  });

  const tagTotal = rows.reduce((a,b) => a + b.target, 0);
  return {
    key, label:planLabel(period, date), s, e,
    tagTotal, orphan, totalTarget:tagTotal+orphan,
    used:totals.sum, rows, count:totals.count
  };
}

function duePeriods(){
  const closed = new Set(state.planDocs.map(d => d.periodType + '|' + d.periodKey));
  const seen = new Set(), out = [];
  state.planTargets.filter(p => p.targetMinutes > 0).forEach(p => {
    const id = p.periodType + '|' + p.periodKey;
    if (closed.has(id) || seen.has(id)) return;
    seen.add(id);
    let end;
    if (p.periodType === 'MONTH'){
      const [y,m] = p.periodKey.split('-').map(Number);
      end = new Date(y, m, 1).getTime();
    } else if (p.periodType === 'YEAR'){
      end = new Date(Number(p.periodKey)+1, 0, 1).getTime();
    } else {
      end = new Date(Number(p.periodKey.slice(0,4))+5, 0, 1).getTime();
    }
    if (end <= nowTs()) out.push({type:p.periodType, key:p.periodKey, end});
  });
  return out.sort((a,b) => b.end - a.end);
}

function renderTimer(){
  const todayS = startOfDay(new Date()), todayE = todayS + DAY;
  const today = totalsIn(todayS, todayE);
  const run = state.running ? itemById(state.running.itemId) : null;
  const used = state.running ? nowTs() - state.running.startAt : 0;
  const tgt = state.running ? state.running.targetMinutes : 0;
  const pct = tgt > 0 ? Math.min(100, used/(tgt*60000)*100) : 0;

  let runCard;
  if (run){
    const tags = run.tagIds.map(id => tagById(id)).filter(Boolean);
    const remain = tgt > 0 ? tgt*60000 - used : 0;
    runCard =
      '<div class="run-card">' +
        '<div class="rc-top"><div class="grow">' +
          '<div class="rc-item"><span class="dot" style="background:' + run.color + '"></span>' + esc(run.name) + '</div>' +
          '<div class="rc-tags">' + tags.map(t => '<span class="chip"><span class="dot" style="width:6px;height:6px;background:' + t.color + '"></span>' + esc(t.name) + '</span>').join('') + '</div>' +
        '</div></div>' +
        '<div class="rc-clock" id="bigClock">' + clock(used) + '</div>' +
        '<div class="rc-hint">' + (tgt > 0
          ? '本次目标 ' + human(tgt*60000) + ' · ' + (remain > 0 ? '还剩 ' + human(remain) : '已超出 ' + human(-remain)) +
            '（到点会弹系统通知，不会自动结束）'
          : '本次没有设目标时长') + '</div>' +
        (tgt > 0 ? '<div class="prog" style="margin-top:10px;background:rgba(255,255,255,.55)"><i style="width:' + pct + '%"></i></div>' : '') +
        '<div class="rc-actions">' +
          '<button class="btn stop wide" data-act="stop">结束并记录</button>' +
          '<button class="btn ghost" data-act="reminder">设本次提醒</button>' +
        '</div>' +
        '<div class="rc-note" data-act="note-running">' + ICONS.note +
          '<span class="' + (state.running.note ? '' : 'ph') + '">' + (state.running.note ? esc(state.running.note) : '＋ 记一句：现在在做什么、进展如何') + '</span></div>' +
      '</div>';
  } else {
    runCard =
      '<div class="run-card idle">' +
        '<div class="rc-item" style="color:#7A7367">没有在计时</div>' +
        '<div class="rc-clock">00:00:00</div>' +
        '<div class="rc-hint">下面点任意事项开始；同一时刻只计一件事，开始新事项会自动结束上一件。</div>' +
        '<div class="rc-actions"><button class="btn" data-act="pick">选择一个事项开始</button></div>' +
      '</div>';
  }

  const cards = state.items.filter(i => !i.archived).map(it => {
    const tags = it.tagIds.map(id => tagById(id)).filter(Boolean);
    const playing = state.running && state.running.itemId === it.id;
    return '<div class="qcard ' + (playing?'playing':'') + '" data-act="start" data-id="' + it.id + '">' +
      '<div class="playbtn">' + (playing ? '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" fill="#fff"/><rect x="14" y="5" width="4" height="14" fill="#fff"/></svg>' : ICONS.play) + '</div>' +
      '<div class="grow"><div class="nm">' + esc(it.name) + '</div>' +
        '<div class="meta">' + (it.targetMinutes ? '目标 ' + human(it.targetMinutes*60000) + ' · ' : '') + tags.map(t=>esc(t.name)).join(' / ') + '</div>' +
      '</div></div>';
  }).join('');

  const todays = state.records.filter(r => overlap(r, todayS, todayE) > 0)
    .sort((a,b) => b.startAt - a.startAt);

  const tl = todays.length ? todays.map(r => {
    const it = itemById(r.itemId); if (!it) return '';
    const d = overlap(r, todayS, todayE);
    return '<div class="tlrow">' +
      '<div class="tl-time">' + hm(r.startAt) + '</div>' +
      '<div class="tl-body" data-act="edit-record" data-id="' + r.id + '">' +
        '<span class="dot" style="background:' + it.color + '"></span>' +
        '<div class="grow"><div class="tl-nm">' + esc(it.name) + '</div>' +
        '<div class="tl-note">' + (r.note ? esc(r.note) : '<span style="color:#B3ADA2">未写备注</span>') + '</div></div>' +
        '<div class="tl-dur">' + human(d) + '</div>' +
      '</div></div>';
  }).join('') : '<div class="empty">今天还没有记录</div>';

  // 右栏
  const tagsToday = new Set();
  todays.forEach(r => { const it = itemById(r.itemId); if (it) it.tagIds.forEach(t => tagsToday.add(t)); });

  const week = [];
  for (let i = 6; i >= 0; i--){
    const s = todayS - i*DAY;
    week.push({label:['日','一','二','三','四','五','六'][new Date(s).getDay()], v:totalsIn(s, s+DAY).sum, today:i===0});
  }
  const maxWeek = Math.max(1, ...week.map(w => w.v));
  const weekBars = week.map(w =>
    '<div class="c ' + (w.today?'today':'') + '"><div class="b" style="height:' + Math.max(3, w.v/maxWeek*100) + '%"></div><div class="l">' + w.label + '</div></div>'
  ).join('');

  const due = duePeriods();
  const dueCard = due.length ? '<div class="side-card" style="border-color:#E8D9BC;background:#FDF8EC">' +
      '<div class="sc-title" style="color:#8A6A24">计划到期，该写总结了</div>' +
      due.slice(0,3).map(d => {
        const nm = d.type === 'MONTH' ? d.key.replace('-','年')+'月' : d.type === 'YEAR' ? d.key+'年' : d.key+'年';
        return '<div class="row" style="margin-top:8px"><span class="small" style="color:#6B5A33">' + nm + '</span>' +
          '<span class="link" style="margin-left:auto" data-act="goto-plan">去总结</span></div>';
      }).join('') + '</div>' : '';

  document.getElementById('scroll').innerHTML =
    '<div class="grid-main"><div>' + runCard +
      '<div class="sec-title"><span>快速开始</span><span class="grow"></span><span class="link" data-act="new-item">＋ 新建事项</span></div>' +
      '<div class="quick-grid">' + cards + '</div>' +
      '<div class="sec-title"><span>今日明细</span><span class="grow"></span><span class="small">' + today.count + ' 条 · ' + human(today.sum) + '</span></div>' +
      '<div class="tl">' + tl + '</div>' +
    '</div><div>' +
      '<div class="side-card"><div class="sc-title">今日</div><div class="sc-big mono">' + human(today.sum) + '</div>' +
        '<div class="kpis"><div class="kpi"><div class="v">' + today.count + '</div><div class="k">记录</div></div>' +
        '<div class="kpi"><div class="v">' + tagsToday.size + '</div><div class="k">标签</div></div>' +
        '<div class="kpi"><div class="v">' + todays.length + '</div><div class="k">件事</div></div></div></div>' +
      '<div class="side-card"><div class="sc-title">最近 7 天</div><div class="bar7">' + weekBars + '</div></div>' +
      dueCard +
      '<div class="side-card"><div class="sc-title">小提示</div>' +
        '<div class="small" style="margin-top:8px;line-height:1.7">空格键开始/结束计时<br>Ctrl+N 新建事项<br>R 补录一条记录<br>关闭窗口不影响计时，最小化到托盘继续走</div></div>' +
    '</div></div>';
}

/* ---------------- 渲染：记录页 ---------------- */

  const list = state.records.filter(r => overlap(r, s, e) > 0).sort((a,b) => b.startAt - a.startAt);
  const sum = list.reduce((a,r) => a + overlap(r, s, e), 0);
  const isToday = s === startOfDay(new Date());

  const rows = list.length ? list.map(r => {
    const it = itemById(r.itemId); if (!it) return '';
    const tags = it.tagIds.map(id => tagById(id)).filter(Boolean);
    return '<tr>' +
      '<td class="mono" style="width:104px;color:#57524A">' + hm(r.startAt) + ' – ' + (r.endAt ? hm(r.endAt) : '进行中') + '</td>' +
      '<td style="width:190px"><div class="row" style="gap:8px"><span class="dot" style="background:' + it.color + '"></span><b style="font-weight:600">' + esc(it.name) + '</b></div></td>' +
      '<td style="width:126px"><div class="tagline">' + tags.map(t => '<span class="chip"><span class="dot" style="width:5px;height:5px;background:' + t.color + '"></span>' + esc(t.name) + '</span>').join('') + '</div></td>' +
      '<td class="mono" style="width:92px">' + human(overlap(r, s, e)) + '</td>' +
      '<td><div class="notecell ' + (r.note?'':'empty') + '" data-act="edit-note" data-id="' + r.id + '">' + (r.note ? esc(r.note) : '＋ 加一句备注') + '</div></td>' +
      '<td style="width:76px;text-align:right"><button class="icon-btn" data-act="edit-record" data-id="' + r.id + '">' + ICONS.edit + '</button>' +
      '<button class="icon-btn" data-act="del-record" data-id="' + r.id + '">' + ICONS.trash + '</button></td>' +
    '</tr>';
  }).join('') : '<tr><td colspan="6"><div class="empty">这一天没有记录</div></td></tr>';

  document.getElementById('scroll').innerHTML =
    '<div class="pagehead"><div class="h">记录</div>' +
      '<div class="seg" style="margin-left:10px">' +
        '<div class="on">按天</div><div data-act="noop">按周</div><div data-act="noop">按月</div></div>' +
      '<div style="margin-left:auto"></div>' +
      '<button class="navbtn" data-act="rec-prev">' + ICONS.chevL + '</button>' +
      '<div style="min-width:150px;text-align:center;font-size:13px;font-weight:600">' + recordDate.getFullYear() + '年' + (recordDate.getMonth()+1) + '月' + recordDate.getDate() + '日 ' + dow(recordDate) + '</div>' +
      '<button class="navbtn" data-act="rec-next">' + ICONS.chevR + '</button>' +
      '<button class="btn ghost sm" data-act="rec-today" style="margin-left:8px">回到今天</button>' +
      '<button class="btn sm" data-act="add-record" style="margin-left:8px">＋ 补录</button>' +
    '</div>' +
    '<div class="card" style="padding:14px 16px 6px">' +
      '<div class="row" style="margin-bottom:12px;gap:20px">' +
        '<div><div class="small">当日合计</div><div style="font-size:20px;font-weight:600;margin-top:2px" class="mono">' + human(sum) + '</div></div>' +
        '<div><div class="small">记录条数</div><div style="font-size:20px;font-weight:600;margin-top:2px" class="mono">' + list.length + '</div></div>' +
        '<div><div class="small">涉及事项</div><div style="font-size:20px;font-weight:600;margin-top:2px" class="mono">' + new Set(list.map(r=>r.itemId)).size + '</div></div>' +
        '<div style="margin-left:auto"><div class="small">' + (isToday?'今天':'当日') + '最长的一段</div>' +
          '<div style="font-size:12.5px;margin-top:6px">' + (list.length ? esc(itemById(list.slice().sort((a,b)=>overlap(b,s,e)-overlap(a,s,e))[0].itemId)?.name || '') : '—') + '</div></div>' +
      '</div>' +
      '<table class="rec"><thead><tr><th>时间</th><th>事项</th><th>标签</th><th>时长</th><th>备注</th><th></th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
}

/* ---------------- 渲染：统计页 ---------------- */
function renderStats(){
  const mode = state.statsTab;
  const anchor = state.statsDate;
  const {s, e} = rangeOf(mode, anchor);
  const t = totalsIn(s, e);
  const label = mode === 'day'
    ? (anchor.getFullYear() + '年' + (anchor.getMonth()+1) + '月' + anchor.getDate() + '日')
    : mode === 'month' ? (anchor.getFullYear() + '年' + (anchor.getMonth()+1) + '月')
    : (anchor.getFullYear() + '年');

  const itemRows = [...t.perItem.entries()].map(([id, ms]) => ({item:itemById(id), ms}))
    .filter(x => x.item).sort((a,b) => b.ms - a.ms);

  const tagRows = state.tags.map(tag => {
    const its = state.items.filter(i => i.tagIds.includes(tag.id))
      .map(i => ({item:i, ms:t.perItem.get(i.id)||0}))
      .filter(x => x.ms > 0).sort((a,b) => b.ms - a.ms);
    return {tag, ms:its.reduce((a,b)=>a+b.ms,0), items:its};
  }).filter(x => x.ms > 0).sort((a,b) => b.ms-a.ms);

  // 柱状
  let bars = '', xlab = '';
  if (mode === 'month'){
    const days = new Date(anchor.getFullYear(), anchor.getMonth()+1, 0).getDate();
    const vals = Array(days).fill(0);
    state.records.forEach(r => {
      let cur = Math.max(r.startAt, s);
      const end = Math.min(endOf(r), e);
      while (cur < end){
        const d0 = startOfDay(cur), d1 = d0 + DAY;
        const seg = Math.min(end, d1) - cur;
        if (seg <= 0) break;
        const idx = new Date(d0).getDate() - 1;
        if (idx >= 0 && idx < days) vals[idx] += seg;
        cur = d1;
      }
    });
    const mx = Math.max(1, ...vals);
    bars = vals.map((v,i) => '<div class="col" title="' + (i+1) + '日 ' + human(v) + '"><div class="b ' + (v===0?'dim':'') + '" style="height:' + (v?Math.max(2,v/mx*100):1) + '%"></div></div>').join('');
    xlab = vals.map((_,i) => '<div>' + ((i+1)%5===1?i+1:'') + '</div>').join('');
  } else if (mode === 'year'){
    const vals = Array(12).fill(0);
    state.records.forEach(r => {
      let cur = Math.max(r.startAt, s);
      const end = Math.min(endOf(r), e);
      while (cur < end){
        const d0 = startOfDay(cur), d1 = d0 + DAY;
        const seg = Math.min(end, d1) - cur;
        if (seg <= 0) break;
        vals[new Date(d0).getMonth()] += seg;
        cur = d1;
      }
    });
    const mx = Math.max(1, ...vals);
    bars = vals.map((v,i) => '<div class="col" title="' + (i+1) + '月 ' + human(v) + '"><div class="b ' + (v===0?'dim':'') + '" style="height:' + (v?Math.max(2,v/mx*100):1) + '%"></div></div>').join('');
    xlab = vals.map((_,i) => '<div>' + (i+1) + '月</div>').join('');
  } else {
    const vals = Array(24).fill(0);
    state.records.forEach(r => {
      let cur = Math.max(r.startAt, s);
      const end = Math.min(endOf(r), e);
      while (cur < end){
        const hEnd = startOfDay(cur) + (new Date(cur).getHours()+1)*3600e3;
        const seg = Math.min(end, hEnd) - cur;
        if (seg <= 0) break;
        vals[new Date(cur).getHours()] += seg;
        cur = hEnd;
      }
    });
    const mx = Math.max(1, ...vals);
    bars = vals.map((v,i) => '<div class="col" title="' + pad(i) + ':00 ' + human(v) + '"><div class="b ' + (v===0?'dim':'') + '" style="height:' + (v?Math.max(2,v/mx*100):1) + '%"></div></div>').join('');
    xlab = vals.map((_,i) => '<div>' + (i%4===0?pad(i):'') + '</div>').join('');
  }

  const days = Math.max(1, Math.round((Math.min(e, nowTs()) - s) / DAY));
  const tagItems = tagRows.map(r => {
    const open = state.expanded.has(r.tag.id);
    return '<div class="trow" data-act="toggle" data-id="' + r.tag.id + '">' +
        '<span class="caret ' + (open?'open':'') + '">' + ICONS.caret + '</span>' +
        '<span class="dot" style="background:' + r.tag.color + '"></span>' +
        '<div><div class="tnm">' + esc(r.tag.name) + '</div><div class="tmeta">' + r.items.length + ' 个事项</div></div>' +
        '<span class="tv">' + human(r.ms) + '</span></div>' +
      (open ? r.items.map(x => '<div class="child"><span class="dot" style="width:6px;height:6px;background:' + x.item.color + '"></span>' +
        '<span class="nm">' + esc(x.item.name) + '</span><span class="v">' + human(x.ms) + '</span></div>').join('') : '');
  }).join('') || '<div class="empty">这段时间还没有记录</div>';

  document.getElementById('scroll').innerHTML =
    '<div class="pagehead"><div class="h">统计</div>' +
      '<div class="seg" style="margin-left:10px">' +
        ['day','month','year'].map(m => '<div class="' + (mode===m?'on':'') + '" data-act="stat-mode" data-mode="' + m + '">' + ({day:'日',month:'月',year:'年'}[m]) + '</div>').join('') +
      '</div><div style="margin-left:auto"></div>' +
      '<button class="navbtn" data-act="stat-prev">' + ICONS.chevL + '</button>' +
      '<div style="min-width:132px;text-align:center;font-size:13px;font-weight:600">' + label + '</div>' +
      '<button class="navbtn" data-act="stat-next">' + ICONS.chevR + '</button>' +
      '<button class="btn ghost sm" data-act="stat-today" style="margin-left:8px">回到今天</button>' +
    '</div>' +
    '<div class="stat-total"><div><div class="lab">本期总时长</div><div class="big">' + human(t.sum) + '</div></div>' +
      '<div class="mini">' +
        '<div><div class="v">' + t.count + '</div><div class="k">次数</div></div>' +
        '<div><div class="v">' + itemRows.length + '</div><div class="k">事项</div></div>' +
        '<div><div class="v">' + tagRows.length + '</div><div class="k">标签</div></div>' +
        '<div><div class="v">' + human(t.sum/days) + '</div><div class="k">日均</div></div>' +
      '</div></div>' +
    '<div class="card" style="margin-top:14px">' +
      '<div class="row"><div style="font-size:12.5px;font-weight:600">' + (mode==='day'?'时段分布':mode==='month'?'每日用时':'每月用时') + '</div>' +
        '<span class="small" style="margin-left:auto">悬停看具体数值</span></div>' +
      '<div class="chart">' + bars + '</div><div class="chart-x">' + xlab + '</div></div>' +
    '<div class="grid-main" style="margin-top:14px">' +
      '<div class="card" style="padding:8px 14px 12px">' +
        '<div class="row" style="padding:8px 2px 6px"><div style="font-size:12.5px;font-weight:600">按标签</div>' +
        '<span class="small" style="margin-left:auto">点标签展开事项</span></div>' +
        '<div class="tagtree">' + tagItems + '</div>' +
        (tagRows.length > 1 ? '<div class="small" style="margin-top:10px;line-height:1.6">提示：一个事项挂多个标签时，同一段时间会分别计入每个标签，所以标签合计可能大于总时长。</div>' : '') +
      '</div>' +
      '<div class="card" style="padding:8px 14px 14px"><div style="font-size:12.5px;font-weight:600;padding:8px 2px 10px">按事项</div>' +
        (itemRows.length ? itemRows.map(x => {
          const p = t.sum ? x.ms/t.sum*100 : 0;
          return '<div style="padding:7px 0"><div class="row" style="gap:8px"><span class="dot" style="background:' + x.item.color + '"></span>' +
            '<span style="font-size:12px">' + esc(x.item.name) + '</span>' +
            '<span style="margin-left:auto;font-size:11.5px" class="mono">' + human(x.ms) + ' · ' + Math.round(p) + '%</span></div>' +
            '<div class="prog" style="margin-top:5px"><i style="width:' + p + '%;background:' + x.item.color + '"></i></div></div>';
        }).join('') : '<div class="empty">暂无数据</div>') +
      '</div></div>';
}

/* ---------------- 渲染：计划页 ---------------- */
function renderPlan(){
  const period = state.planPeriod;
  const date = state.planDate;

  const seg = '<div class="seg">' + [['MONTH','月度'],['YEAR','年度'],['FIVE','五年']].map(([k,l]) =>
    '<div class="' + (period===k?'on':'') + '" data-act="plan-period" data-p="' + k + '">' + l + '</div>').join('') + '</div>';

  const tabs = '<div class="seg">' +
    '<div class="' + (state.planTab==='current'?'on':'') + '" data-act="plan-tab" data-t="current">本期计划</div>' +
    '<div class="' + (state.planTab==='history'?'on':'') + '" data-act="plan-tab" data-t="history">历史计划</div></div>';

  let body = '';

  if (state.planTab === 'history'){
    const docs = state.planDocs.slice().sort((a,b) => (b.closedAt||0)-(a.closedAt||0));
    body = docs.length ? docs.map(d => {
      const pname = d.periodType === 'MONTH' ? d.periodKey.replace('-','年')+'月'
        : d.periodType === 'YEAR' ? d.periodKey+'年' : d.periodKey+'年';
      const snap = d.snapshot;
      const target = snap.totalTargetMinutes*60000;
      const used = snap.rows.reduce((a,r) => a + r.usedMillis, 0);
      const pct = target ? Math.round(used/target*100) : 0;
      return '<div class="hist"><div class="hh"><div class="hname">' + pname + '</div>' +
        '<span class="badge closed">已归档</span>' +
        '<span class="small">' + ({MONTH:'月度',YEAR:'年度',FIVE:'五年'}[d.periodType]) + ' · ' + dstr(new Date(d.closedAt)) + ' 归档</span>' +
        '<span style="margin-left:auto" class="link" data-act="toggle-doc" data-id="' + d.periodType + '|' + d.periodKey + '">展开明细</span></div>' +
        '<div class="hkm"><span>目标 <b>' + human(target) + '</b></span><span>实际 <b style="color:' + (pct>=100?'#2F6B4F':'#8A6A24') + '">' + human(used) + '</b></span>' +
        '<span>完成度 <b>' + pct + '%</b></span></div>' +
        '<div class="prog" style="margin-top:8px"><i style="width:' + Math.min(100,pct) + '%"></i></div>' +
        (d.summary ? '<div class="hsum">' + esc(d.summary) + '</div>' : '<div class="small" style="margin-top:9px">（这期没有写总结）</div>') +
        (state.expanded.has('doc:' + d.periodType + '|' + d.periodKey) ? '<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:8px">' +
          snap.rows.map(r => '<div class="row" style="padding:6px 0;gap:9px"><span class="dot" style="background:' + r.color + '"></span>' +
            '<span style="font-size:12px">' + esc(r.name) + '</span>' +
            '<span class="small" style="margin-left:auto">目标 ' + human(r.targetMinutes*60000) + '</span>' +
            '<span style="width:88px;text-align:right;font-size:11.5px" class="mono">' + human(r.usedMillis) + '</span></div>').join('') +
          '</div>' : '') +
      '</div>';
    }).join('') : '<div class="card"><div class="empty">还没有归档的计划。每一期结束后点「结束本期并归档」，写下的总结会留在这里。</div></div>';
  } else {
    const p = computePlan(period, date);
    const doc = state.planDocs.find(d => d.periodType === period && d.periodKey === p.key);
    const closed = !!doc;
    const pct = p.totalTarget ? Math.round(p.used/(p.totalTarget*60000)*100) : 0;
    const remainDays = Math.max(0, Math.ceil((Math.min(p.e, p.s + 366*DAY) - nowTs())/DAY));
    const needPerDay = remainDays > 0 ? Math.max(0, p.totalTarget*60000 - p.used)/remainDays : 0;

    const rows = p.rows.map(r => {
      const open = state.expanded.has(r.tag.id);
      const rp = r.target ? Math.min(100, Math.round(r.used/(r.target*60000)*100)) : 0;
      return '<div class="prow"><div class="ph" data-act="toggle" data-id="' + r.tag.id + '">' +
        '<span class="caret ' + (open?'open':'') + '" style="width:14px;color:#9A948A">' + ICONS.caret + '</span>' +

/* ---------------- 计时 ---------------- */
function startTimer(itemId){
  const item = itemById(itemId);
  if (!item) return;
  if (state.running){
    if (state.running.itemId === itemId){ closeDialog(); return; }
    endTimer(true);
  }
  state.running = {itemId, startAt:nowTs(), note:'', targetMinutes:item.targetMinutes || 0};
  render();
  toast(item.targetMinutes ? '开始「' + item.name + '」，' + item.targetMinutes + ' 分钟后提醒' : '开始「' + item.name + '」');
}

function endTimer(quiet){
  if (!state.running) return null;
  const endAt = nowTs();
  const rec = {id:'r'+(++RID), itemId:state.running.itemId, startAt:state.running.startAt, endAt, note:state.running.note || ''};
  state.records.push(rec);
  const item = itemById(state.running.itemId);
  const dur = endAt - state.running.startAt;
  state.running = null;
  render();
  if (!quiet) toast('已记录 ' + human(dur));
  return rec;
}

function stopWithNote(){
  if (!state.running){ toast('当前没有在计时'); return; }
  const item = itemById(state.running.itemId);
  const dur = nowTs() - state.running.startAt;
  const rec = endTimer(true);
  openNoteDialog(rec, item, dur);
}

function openNoteDialog(rec, item, dur){
  openDialog(
    '<div class="dlg-h"><div class="t">这次做了什么？</div><button class="icon-btn x" data-act="close-dlg">' + ICONS.x + '</button></div>' +
    '<div class="dlg-sub">' + esc(item ? item.name : '') + ' · ' + human(dur) + '。备注不是必填，写一句当时的实际情况，以后回看更有用。</div>' +
    '<textarea class="textarea" id="noteInput" placeholder="比如：前半段顺利，后来被打断了…"></textarea>' +
    '<div class="quickwords">' + ['顺利','被打断','走神了','状态不错','有点累'].map(w => '<span class="qw" data-act="qw" data-w="' + w + '">' + w + '</span>').join('') + '</div>' +
    '<div class="dlg-foot"><button class="btn sub" data-act="skip-note">先不写</button>' +
      '<button class="btn" data-act="save-note" data-id="' + rec.id + '">保存备注</button></div>',

/* ---------------- 弹窗 ---------------- */
function openDialog(html, wide){
  const o = document.getElementById('overlay');
  o.innerHTML = '<div class="dialog ' + (wide?'wide':'') + '">' + html + '</div>';
  o.hidden = false;
  o.onclick = e => { if (e.target === o) closeDialog(); };
}
function closeDialog(){
  const o = document.getElementById('overlay');
  o.hidden = true; o.innerHTML = '';
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1900);
}

      const tags = i.tagIds.map(id=>tagById(id)).filter(Boolean).map(t=>t.name).join(' / ');
      return '<div class="qcard" style="margin-bottom:8px" data-act="start" data-id="' + i.id + '">' +
        '<div class="playbtn">' + ICONS.play + '</div><div class="grow"><div class="nm">' + esc(i.name) + '</div>' +
        '<div class="meta">' + tags + (i.targetMinutes?' · 目标 ' + human(i.targetMinutes*60000):'') + '</div></div></div>';
    }).join('') +
    '<div class="dlg-foot"><button class="btn sub" data-act="close-dlg">取消</button></div>',
    true
  );
}

function openReminder(){
  openDialog(
    '<div class="dlg-h"><div class="t">设本次提醒</div><button class="icon-btn x" data-act="close-dlg">' + ICONS.x + '</button></div>' +
    '<div class="dlg-sub">只影响这一次，不会改事项目标。到点弹系统通知，计时继续。</div>' +
    '<div class="field"><label>做满多少分钟提醒</label><div class="numline">' +
      '<input class="input" id="remMin" type="number" min="0" step="5" value="' + (state.running?state.running.targetMinutes:'') + '"><span>分钟</span></div></div>' +
    '<div class="dlg-foot"><button class="btn sub" data-act="close-dlg">取消</button>' +
      '<button class="btn" data-act="save-reminder">保存</button></div>',
    true
  );
}

/* ---------------- 交互分发 ---------------- */
document.addEventListener('click', e => {
  const navEl = e.target.closest('[data-page]');
  if (navEl){ state.page = navEl.dataset.page; render(); return; }

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;

  switch (act){
    case 'noop': return;
    case 'start': closeDialog(); startTimer(id); return;
    case 'stop': stopWithNote(); return;
    case 'pick': openSelectItem(); return;
    case 'reminder': openReminder(); return;
    case 'close-dlg': closeDialog(); return;

    case 'note-running': {
      openDialog(
        '<div class="dlg-h"><div class="t">记一句</div><button class="icon-btn x" data-act="close-dlg">' + ICONS.x + '</button></div>' +
        '<div class="dlg-sub">正在计时也能改，随时补。</div>' +
        '<textarea class="textarea" id="noteInput" placeholder="现在在做什么、卡在哪、进展如何">' + esc(state.running?.note||'') + '</textarea>' +
        '<div class="quickwords">' + ['顺利','被打断','走神了','状态不错','有点累'].map(w => '<span class="qw" data-act="qw" data-w="' + w + '">' + w + '</span>').join('') + '</div>' +
        '<div class="dlg-foot"><button class="btn sub" data-act="close-dlg">取消</button><button class="btn" data-act="save-note-running">保存</button></div>',
        true);
      setTimeout(() => { const x = document.getElementById('noteInput'); if (x) x.focus(); }, 30);
      return;
    }
    case 'save-note-running': {
      state.running.note = document.getElementById('noteInput').value.trim();
      closeDialog(); render(); toast('备注已保存'); return;
    }
    case 'qw': {
      const ta = document.getElementById('noteInput');
      if (ta){ const w = el.dataset.w; ta.value = ta.value ? ta.value + '，' + w : w; ta.focus(); }
      return;
    }
    case 'skip-note': closeDialog(); toast('已保存记录'); return;
    case 'save-note': {
      const rec = state.records.find(r => r.id === id);
      if (rec) rec.note = document.getElementById('noteInput').value.trim();
      closeDialog(); render(); toast('备注已保存'); return;
    }
    case 'save-note-only': {
      const rec = state.records.find(r => r.id === id);
      if (rec) rec.note = document.getElementById('noteInput').value.trim();
      closeDialog(); render(); toast('备注已保存'); return;
    }
    case 'edit-note': openNoteOnly(id); return;
    case 'edit-record': {
      const r = state.records.find(x => x.id === id);
      if (r) openRecordDialog(r);
      return;
    }
    case 'del-record': {
      state.records = state.records.filter(r => r.id !== id);
      render(); toast('记录已删除'); return;
    }

    case 'new-item': openItemDialog(null); return;
    case 'edit-item': openItemDialog(itemById(id)); return;
    case 'pick-tag': el.classList.toggle('on'); return;
    case 'pick-color': {
      document.querySelectorAll('.sw').forEach(s => s.classList.remove('sel'));
      el.classList.add('sel'); return;
    }
    case 'save-item': {
      const name = document.getElementById('itName').value.trim();
      const target = Math.max(0, parseInt(document.getElementById('itTarget').value || '0', 10) || 0);
      const color = (document.querySelector('.sw.sel') || {}).dataset?.c || COLORS[0];
      const note = document.getElementById('itNote').value.trim();
      const tagIds = [...document.querySelectorAll('#tagPick .pk.on')].map(x => x.dataset.id);
      if (!name){ toast('事项名称不能为空'); return; }
      if (!tagIds.length){ toast('至少选一个标签'); return; }
      if (editingItem){
        Object.assign(editingItem, {name, targetMinutes:target, color, note, tagIds});
        closeDialog(); render(); toast('事项已更新');
      } else {
        state.items.push({id:'i'+(++SEQ), name, targetMinutes:target, color, note, tagIds, archived:false, createdAt:nowTs()});
        closeDialog(); render(); toast(target ? '已新建「' + name + '」，目标 ' + target + ' 分钟' : '已新建事项「' + name + '」');
      }
      return;
    }
    case 'archive-item': {
      const it = itemById(id);
      if (it){ it.archived = !it.archived; }
      closeDialog(); render(); toast('已归档，历史记录保留');
      return;
    }
    case 'new-tag': openTagDialog(null); return;
    case 'edit-tag': openTagDialog(tagById(id)); return;

    case 'add-record': openAddRecord(); return;
    case 'save-add-record': {
      const itemId = document.getElementById('arItem').value;
      const s = new Date(document.getElementById('arStart').value).getTime();
      const en = new Date(document.getElementById('arEnd').value).getTime();
      if (!(en > s)){ toast('结束时间必须晚于开始时间'); return; }
      state.records.push({id:'r'+(++RID), itemId, startAt:s, endAt:en, note:document.getElementById('arNote').value.trim()});
      closeDialog(); recordDate = new Date(s); if (state.page==='records') renderRecords(); else render();
      toast('已补录 ' + human(en-s)); return;
    }
    case 'rec-prev': recordDate = new Date(recordDate.getTime()-DAY); renderRecords(); return;
    case 'rec-next': recordDate = new Date(recordDate.getTime()+DAY); renderRecords(); return;
    case 'rec-today': recordDate = new Date(); renderRecords(); return;

    case 'stat-mode': state.statsTab = el.dataset.mode; renderStats(); return;
    case 'stat-prev': {
      const d = new Date(state.statsDate);
      state.statsDate = state.statsTab==='month' ? new Date(d.getFullYear(), d.getMonth()-1, 1)
        : state.statsTab==='year' ? new Date(d.getFullYear()-1, 0, 1) : new Date(d.getTime()-DAY);
      renderStats(); return;
    }
    case 'stat-next': {
      const d = new Date(state.statsDate);
      state.statsDate = state.statsTab==='month' ? new Date(d.getFullYear(), d.getMonth()+1, 1)
        : state.statsTab==='year' ? new Date(d.getFullYear()+1, 0, 1) : new Date(d.getTime()+DAY);
      renderStats(); return;
    }
    case 'stat-today': state.statsDate = new Date(); renderStats(); return;

    case 'toggle': {
      if (state.expanded.has(id)) state.expanded.delete(id); else state.expanded.add(id);
      if (state.page === 'stats') renderStats(); else renderPlan();
      return;
    }
    case 'goto-plan': state.page = 'plan'; state.planTab = 'current'; render(); return;
    case 'plan-tab': state.planTab = el.dataset.t; renderPlan(); return;
    case 'plan-period': state.planPeriod = el.dataset.p; renderPlan(); return;
    case 'plan-prev': state.planDate = shiftPlan(state.planPeriod, state.planDate, -1); renderPlan(); return;
    case 'plan-next': state.planDate = shiftPlan(state.planPeriod, state.planDate, 1); renderPlan(); return;
    case 'set-tag-target': openSetTarget('tag', id); return;
    case 'set-item-target': openSetTarget('item', id); return;
    case 'tgt-quick': document.getElementById('tgtMin').value = el.dataset.m; return;
    case 'save-target': {
      const kind = el.dataset.kind, refId = el.dataset.id;
      const minutes = Math.max(0, parseInt(document.getElementById('tgtMin').value || '0', 10) || 0);
      const period = state.planPeriod, key = planKey(period, state.planDate);
      const type = kind === 'tag' ? 'TAG' : 'ITEM';
      state.planTargets = state.planTargets.filter(p => !(p.refId===refId && p.targetType===type && p.periodType===period && p.periodKey===key));
      if (minutes > 0) state.planTargets.push({refId, targetType:type, periodType:period, periodKey:key, targetMinutes:minutes});
      closeDialog(); renderPlan();
      toast(minutes > 0 ? '目标 ' + human(minutes*60000) : '已清除目标');
      return;
    }
    case 'clear-target': {
      const kind = el.dataset.kind, refId = el.dataset.id;
      const period = state.planPeriod, key = planKey(period, state.planDate);
      const type = kind === 'tag' ? 'TAG' : 'ITEM';
      state.planTargets = state.planTargets.filter(p => !(p.refId===refId && p.targetType===type && p.periodType===period && p.periodKey===key));
      closeDialog(); renderPlan(); toast('已清除目标'); return;
    }
    case 'copy-prev': {
      const period = state.planPeriod;
      const prevDate = shiftPlan(period, state.planDate, -1);
      const prevKey = planKey(period, prevDate), key = planKey(period, state.planDate);
      const prev = state.planTargets.filter(p => p.periodType===period && p.periodKey===prevKey && p.targetMinutes>0);
      if (!prev.length){ toast('上一期没有设置过计划'); return; }
      state.planTargets = state.planTargets.filter(p => !(p.periodType===period && p.periodKey===key));
      prev.forEach(p => state.planTargets.push({...p, periodKey:key}));
      renderPlan();
      toast('已沿用上一期计划（' + prev.length + ' 条）');
      return;
    }
    case 'close-plan': openClosePlan(); return;
    case 'do-close-plan': {
      const summary = document.getElementById('planSummary').value.trim();
      const p = computePlan(state.planPeriod, state.planDate);
      if (!p.totalTarget && p.used <= 0){ toast('本期还没有计划或记录，不用归档'); return; }
      state.planDocs = state.planDocs.filter(d => !(d.periodType===state.planPeriod && d.periodKey===p.key));
      state.planDocs.push({
        periodType:state.planPeriod, periodKey:p.key, closedAt:nowTs(), summary,
        snapshot:{
          totalTargetMinutes:p.totalTarget, totalUsedMillis:p.used,
          rows:p.rows.map(r => ({name:r.tag.name, color:r.tag.color, targetMinutes:r.target, usedMillis:r.used,
            items:r.items.map(x => ({name:x.item.name, color:x.item.color, targetMinutes:x.target, usedMillis:x.used}))}))
        }
      });
      closeDialog(); renderPlan(); toast('「' + p.label + '」已归档，总结留在历史计划里');
      return;
    }
    case 'reopen': {
      const key = planKey(state.planPeriod, state.planDate);
      state.planDocs = state.planDocs.filter(d => !(d.periodType===state.planPeriod && d.periodKey===key));
      renderPlan(); toast('已取消归档，回到本期'); return;
    }
    case 'toggle-doc': {
      const k = 'doc:' + id;
      if (state.expanded.has(k)) state.expanded.delete(k); else state.expanded.add(k);
      renderPlan(); return;
    }

    case 'toggle-auto': state.autoBackup = !state.autoBackup; render(); break;
    case 'del-tag': {
      const t = tagById(id);
      if (!t) return;
      const used = state.items.filter(i => i.tagIds.includes(id)).length;
      state.tags = state.tags.filter(x => x.id !== id);
      state.items.forEach(i => { i.tagIds = i.tagIds.filter(x => x !== id); });
      state.planTargets = state.planTargets.filter(p => !(p.refId === id && p.targetType === 'TAG'));
      closeDialog(); render();
      toast(used ? '已删除标签「' + t.name + '」，' + used + ' 个事项仍保留' : '已删除标签「' + t.name + '」');
      return;
    }
    case 'export': toast('原型演示：实际会弹出保存对话框，导出 TimeBook-备份-年月日-时分.json'); return;
    case 'import': toast('原型演示：实际会打开文件选择器，导入手机备份 json'); return;
    case 'open-folder': toast('原型演示：实际会打开数据文件所在文件夹'); return;
  }
});

function openTagDialog(tag){
  openDialog(
    '<div class="dlg-h"><div class="t">' + (tag?'编辑标签':'新建标签') + '</div><button class="icon-btn x" data-act="close-dlg">' + ICONS.x + '</button></div>' +
    '<div class="dlg-sub">标签是事项的上层归类，比如「工作」「读书」「运动」。</div>' +
    '<div class="field"><label>名称</label><input class="input" id="tgName" value="' + esc(tag?tag.name:'') + '"></div>' +
    '<div class="field"><label>颜色</label><div class="swatches">' +
      COLORS.map(c => '<span class="sw ' + (tag&&tag.color===c?'sel':'') + '" style="background:' + c + '" data-act="pick-color" data-c="' + c + '"></span>').join('') +
    '</div></div>' +
    '<div class="dlg-foot">' + (tag ? '<button class="btn danger sm" data-act="del-tag" data-id="' + tag.id + '" style="margin-right:auto">删除标签</button>' : '<span></span>') +
      '<button class="btn sub" data-act="close-dlg">取消</button>' +
      '<button class="btn" data-act="save-tag" data-id="' + (tag?tag.id:'') + '">保存</button></div>',
    true
  );
}

function openRecordDialog(r){
  const item = itemById(r.itemId);
  const fmt = ts => { const d = new Date(ts); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); };
  openDialog(
    '<div class="dlg-h"><div class="t">编辑记录</div><button class="icon-btn x" data-act="close-dlg">' + ICONS.x + '</button></div>' +
    '<div class="dlg-sub">' + esc(item?.name||'') + '</div>' +
    '<div class="field"><label>开始</label><input class="input" id="erStart" type="datetime-local" value="' + fmt(r.startAt) + '"></div>' +
    '<div class="field"><label>结束</label><input class="input" id="erEnd" type="datetime-local" value="' + fmt(endOf(r)) + '"></div>' +
    '<div class="field"><label>备注</label><textarea class="textarea" id="erNote">' + esc(r.note) + '</textarea></div>' +
    '<div class="dlg-foot"><button class="btn danger sm" data-act="del-record" data-id="' + r.id + '" style="margin-right:auto">删除</button>' +
      '<button class="btn sub" data-act="close-dlg">取消</button>' +
      '<button class="btn" data-act="save-record" data-id="' + r.id + '">保存</button></div>',
    true
  );
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act="save-record"]');
  if (!el) return;
  const r = state.records.find(x => x.id === el.dataset.id);
  if (!r) return;
  const s = new Date(document.getElementById('erStart').value).getTime();
  const en = new Date(document.getElementById('erEnd').value).getTime();
  if (!(en > s)){ toast('结束时间必须晚于开始时间'); return; }
  r.startAt = s; r.endAt = en; r.note = document.getElementById('erNote').value.trim();
  closeDialog(); render(); toast('记录已保存');
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act="save-tag"]');
  if (!el) return;
  const name = document.getElementById('tgName').value.trim();
  if (!name){ toast('标签名称不能为空'); return; }
  const color = (document.querySelector('.sw.sel') || {}).dataset?.c || COLORS[0];
  const id = el.dataset.id;
  if (id){
    const t = tagById(id); if (t){ t.name = name; t.color = color; }
    toast('标签已更新');
  } else {
    state.tags.push({id:'t'+(++SEQ), name, color, note:''});
    toast('已新建标签「' + name + '」');
  }
  closeDialog(); render();
});

/* 键盘 */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closeDialog(); return; }
  const typing = ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
  if (typing) return;
  if (e.code === 'Space'){ e.preventDefault(); state.running ? stopWithNote() : openSelectItem(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n'){ e.preventDefault(); openItemDialog(null); return; }
  if (e.key.toLowerCase() === 'r'){ e.preventDefault(); openAddRecord(); return; }
});

/* 每秒刷新进行中计时 */
setInterval(() => {
  if (!state.running) return;
  const el = document.getElementById('bigClock');
  const pill = document.getElementById('pillClock');
  const used = nowTs() - state.running.startAt;
  if (el) el.textContent = clock(used);
  if (pill) pill.textContent = clock(used);
}, 1000);

/* 启动 */
render();
</script>
</body>
</html>
